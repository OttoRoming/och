name = "bash"
version = "5.3"
bootstrap = true

dependencies = ["glibc", "ncurses", "readline"]
make_dependencies = [
    "binutils",
    "bison",
    "coreutils",
    "diffutils",
    "gawk",
    "gcc",
    "grep",
    "make",
    "patch",
    "sed",
    "texinfo",
]

[[sources]]
type = "http"
url = "https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz"
sha256 = "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"

[build]
type = "script"
script = "build.sh"

[check]
script = "check.sh"
