name = "binutils"
version = "2.47"
bootstrap = true

dependencies = ["glibc", "zlib", "zstd"]
make_dependencies = [
    "bash",
    "binutils",
    "coreutils",
    "diffutils",
    "file",
    "flex",
    "gawk",
    "gcc",
    "grep",
    "make",
    "perl",
    "pkgconf",
    "sed",
    "texinfo",
]

[[sources]]
type = "http"
url = "https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz"
sha256 = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"

[build]
type = "script"
script = "build.sh"

[check]
script = "check.sh"
