name = "bison"
version = "3.8.2"
bootstrap = true

dependencies = ["glibc"]
make_dependencies = [
    "bash",
    "binutils",
    "coreutils",
    "diffutils",
    "gcc",
    "gettext",
    "grep",
    "m4",
    "make",
    "perl",
    "sed",
]

[[sources]]
type = "http"
url = "https://ftpmirror.gnu.org/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[build]
type = "script"
script = "build.sh"

[check]
script = "check.sh"
