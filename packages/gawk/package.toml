name = "gawk"
version = "5.4.1"
bootstrap = true

dependencies = ["bash", "glibc", "mpfr"]
make_dependencies = [
    "binutils",
    "coreutils",
    "gcc",
    "gettext",
    "gmp",
    "grep",
    "make",
    "patch",
    "readline",
    "sed",
    "texinfo",
]

[[sources]]
type = "http"
url = "https://ftpmirror.gnu.org/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[build]
type = "script"
script = "build.sh"

[check]
script = "check.sh"
