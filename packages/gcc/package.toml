name = "gcc"
version = "16.2.0"
bootstrap = true

dependencies = ["bash", "binutils", "glibc", "mpc", "python"]
make_dependencies = [
    "coreutils",
    "diffutils",
    "findutils",
    "gawk",
    "gcc",
    "gettext",
    "gmp",
    "grep",
    "m4",
    "make",
    "mpfr",
    "patch",
    "perl",
    "sed",
    "tar",
    "texinfo",
    "zstd",
]

[[sources]]
type = "http"
url = "https://ftpmirror.gnu.org/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"

[build]
type = "script"
script = "build.sh"

[check]
script = "check.sh"
