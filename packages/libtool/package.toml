name = "libtool"
version = "2.6.2"

dependencies = [
    "autoconf",
    "automake",
    "bash",
    "binutils",
    "coreutils",
    "file",
    "gcc",
    "glibc",
    "grep",
    "make",
    "sed",
]
make_dependencies = ["diffutils", "gawk", "texinfo"]

[[sources]]
type = "http"
url = "https://ftpmirror.gnu.org/libtool/libtool-2.6.2.tar.xz"
