name = "util-linux"
version = "2.42.2"
bootstrap = true

dependencies = ["glibc", "ncurses", "readline", "systemd"]
make_dependencies = [
    "bash",
    "binutils",
    "coreutils",
    "diffutils",
    "file",
    "findutils",
    "gawk",
    "gcc",
    "gettext",
    "grep",
    "make",
    "pkgconf",
    "sed",
]

[[sources]]
type = "http"
url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
sha256 = "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"

[build]
type = "script"
script = "build.sh"

[check]
script = "check.sh"
